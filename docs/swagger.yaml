host: localhost:8080
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: This is the API server for the Diploma project.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Diploma Server API
  version: "1.0"
paths:
  /auth/{provider}:
    get:
      description: Initiate OAuth2 login with a provider (google, etc.)
      parameters:
      - description: Provider
        in: path
        name: provider
        required: true
        type: string
      responses: {}
      summary: Sign in with provider
      tags:
      - auth
  /auth/{provider}/callback:
    get:
      description: Handle OAuth2 callback
      parameters:
      - description: Provider
        in: path
        name: provider
        required: true
        type: string
      responses:
        "307":
          description: Temporary Redirect
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: OAuth2 Callback
      tags:
      - auth
  /auth/change-password:
    post:
      consumes:
      - application/json
      description: Change password for authenticated user (requires current password)
      parameters:
      - description: Change Password Input
        in: body
        name: input
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Change password
      tags:
      - auth
  /auth/forgot:
    post:
      consumes:
      - application/x-www-form-urlencoded
      description: Send reset password link to email
      parameters:
      - description: User Email
        in: formData
        name: email
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Forgot password
      tags:
      - auth
  /auth/google/mobile:
    post:
      consumes:
      - application/json
      description: Sign in or register with Google credentials from mobile app
      parameters:
      - description: Google Sign-In Input
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/models.GoogleSignInInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Sign in with Google (mobile)
      tags:
      - auth
  /auth/login:
    post:
      consumes:
      - application/json
      description: Login with email and password
      parameters:
      - description: Login Input
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/models.LoginInput'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      summary: Login user
      tags:
      - auth
  /auth/logout:
    post:
      description: Invalidate the current JWT token
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Logout user
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Register a new user with email, password and name
      parameters:
      - description: Register Input
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/models.RegisterInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Register a new user
      tags:
      - auth
  /auth/reset:
    post:
      consumes:
      - application/x-www-form-urlencoded
      description: Reset password with token
      parameters:
      - description: Reset Token
        in: formData
        name: token
        required: true
        type: string
      - description: New Password
        in: formData
        name: password
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      summary: Reset password
      tags:
      - auth
  /auth/verify:
    get:
      description: Verify user email with token
      parameters:
      - description: Verification Token
        in: query
        name: token
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      summary: Verify email
      tags:
      - auth
  /auth/verify/regenerate:
    get:
      consumes:
      - application/json
      description: Resends the verification email to the user using token (preferred)
        or email
      parameters:
      - description: Old Verification Token
        in: query
        name: token
        type: string
      - description: User Email
        in: query
