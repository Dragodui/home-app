# Joins the backend to the s7a network, so it reaches self-hosted storage at http://s7a:6465.
# Start s7a first (its compose creates network s7a_default), then:
#   docker compose -f docker-compose.yaml -f docker-compose.s7a.yaml up -d --build
services:
  backend:
    networks:
      - app-network
      - s7a

networks:
  s7a:
    external: true
    name: s7a_default
